<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REACHTEN DCF Model</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --green: #4ade80; --red: #f87171; --amber: #fbbf24; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
  .container { max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 12px; }
  .card h3 { font-size: 0.8rem; color: var(--muted); margin: 10px 0 6px; }
  .param-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.82rem; }
  .param-row label { color: var(--muted); }
  .param-row input, .param-row select { width: 75px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 5px; background: #0f172a; color: var(--text); font-size: 0.82rem; text-align: right; }
  .param-row input[type="range"] { width: 80px; margin-right: 6px; accent-color: var(--accent); }
  .yr-grid { display: grid; grid-template-columns: 60px 1fr 1fr; gap: 4px 8px; font-size: 0.78rem; align-items: center; margin-bottom: 4px; }
  .yr-grid .label { color: var(--muted); }
  .yr-grid input { padding: 2px 4px; border: 1px solid var(--border); border-radius: 4px; background: #0f172a; color: var(--text); font-size: 0.78rem; text-align: right; width: 100%; }
  .yr-header { display: contents; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { text-align: right; padding: 5px 8px; color: var(--muted); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
  th:first-child { text-align: left; }
  td { text-align: right; padding: 5px 8px; border-bottom: 1px solid #1a2744; }
  td:first-child { text-align: left; color: var(--muted); }
  .sum-row td { border-top: 2px solid var(--border); font-weight: 600; }
  .scenario-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .scenario-tab { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 0.8rem; }
  .scenario-tab.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 600; }
  .val-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 12px; }
  .val-card { text-align: center; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
  .val-card .val { font-size: 1.4rem; font-weight: 700; }
  .val-card .lbl { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .val-card.bear { border-color: var(--red); } .val-card.bear .val { color: var(--red); }
  .val-card.base { border-color: var(--accent); } .val-card.base .val { color: var(--accent); }
  .val-card.bull { border-color: var(--green); } .val-card.bull .val { color: var(--green); }
  .section-label { font-size: 0.75rem; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .wacc-display { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 0.82rem; margin: 8px 0; }
  .wacc-display .row { display: flex; justify-content: space-between; }
  .wacc-display .row .lbl { color: var(--muted); }
  .wacc-display .row .val { font-weight: 500; }
  .highlight { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
  .sensitivity-grid { display: grid; grid-template-columns: auto repeat(5, 1fr); gap: 2px; font-size: 0.78rem; }
  .sensitivity-grid .cell { padding: 4px 8px; text-align: center; }
  .sensitivity-grid .header { color: var(--muted); font-weight: 500; }
  .sensitivity-grid .row-label { color: var(--muted); text-align: right; padding-right: 8px; }
  .sensitivity-grid .value { background: #0f172a; border-radius: 4px; }
  .sensitivity-grid .value.up { color: var(--green); }
  .sensitivity-grid .value.down { color: var(--red); }
  .inline-flex { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div class="container">
<h1>REACHTEN DCF Model</h1>
<div class="subtitle">Reach Ten Holdings Berhad (5332.KL) — Discounted Cash Flow Valuation</div>

<div class="grid">
  <!-- Sidebar Controls -->
  <div>
    <div class="card" style="margin-bottom:12px;">
      <h2>Market Data</h2>
      <div class="param-row"><label>Share Price (RM)</label><input type="number" id="price" value="0.415" step="0.001" oninput="calc()"></div>
      <div class="param-row"><label>Shares (M, diluted)</label><input type="number" id="shares" value="1050" step="10" oninput="calc()"></div>
      <div class="param-row"><label>Net Cash (RM M)</label><input type="number" id="netCash" value="159.59" step="0.01" oninput="calc()"></div>
      <div class="param-row"><label>TTM Revenue (RM M)</label><input type="number" id="ttmRev" value="107.45" step="0.01" oninput="calc()"></div>
      <div class="param-row"><label>TTM EBIT (RM M)</label><input type="number" id="ttmEbit" value="44.04" step="0.01" oninput="calc()"></div>
      <div class="param-row"><label>D&amp;A (% rev)</label><input type="number" id="daRate" value="3.69" step="0.01" oninput="calc()"></div>
      <div class="param-row"><label>CapEx (% rev)</label><input type="number" id="capexRate" value="10.06" step="0.01" oninput="calc()"></div>
      <div class="param-row"><label>Tax Rate</label><input type="number" id="taxRate" value="22.12" step="0.01" oninput="calc()"></div>
      <div class="param-row"><label>NWC / ΔRev</label><input type="number" id="nwcPct" value="2.0" step="0.1" oninput="calc()"></div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <h2>WACC Settings</h2>
      <div class="param-row"><label>Risk-Free Rate</label><input type="number" id="rf" value="3.8" step="0.1" oninput="calc()"></div>
      <div class="param-row"><label>Beta</label><input type="number" id="beta" value="0.85" step="0.01" oninput="calc()"></div>
      <div class="param-row"><label>ERP</label><input type="number" id="erp" value="6.0" step="0.1" oninput="calc()"></div>
      <div class="param-row"><label>Pre-tax Cost of Debt</label><input type="number" id="cod" value="5.0" step="0.1" oninput="calc()"></div>
      <div class="wacc-display" id="waccDisplay"></div>
    </div>

    <div class="card">
      <h2>Growth Assumptions</h2>
      <div class="scenario-tabs">
        <button class="scenario-tab active" id="tabBear" onclick="setScenario('Bear')">Bear</button>
        <button class="scenario-tab" id="tabBase" onclick="setScenario('Base')">Base</button>
        <button class="scenario-tab" id="tabBull" onclick="setScenario('Bull')">Bull</button>
      </div>
      <div id="scenarioInputs"></div>
    </div>
  </div>

  <!-- Main Content -->
  <div>
    <div class="card" style="margin-bottom:12px;">
      <h2>Valuation Summary</h2>
      <div class="val-grid" id="valGrid"></div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h2 style="margin:0;">Projected Free Cash Flows</h2>
        <span id="activeScenario" style="font-size:0.8rem;color:var(--accent);font-weight:600;">BASE</span>
      </div>
      <div style="overflow-x:auto;">
        <table id="fcfTable"></table>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <h2>Bridge to Equity Value</h2>
      <div style="overflow-x:auto;">
        <table id="bridgeTable"></table>
      </div>
    </div>

    <div class="card">
      <h2>Sensitivity: Implied Price by WACC vs Terminal Growth</h2>
      <div style="overflow-x:auto;margin-top:8px;">
        <div id="sensitivityTable"></div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
// Scenario presets
const presets = {
  Bear: {
    growth: [-5, 2, 3, 3, 2],
    margin: [35, 36, 37, 37, 36],
    tg: 2.0
  },
  Base: {
    growth: [3, 5, 5, 4, 3],
    margin: [38, 39, 40, 40, 39],
    tg: 2.5
  },
  Bull: {
    growth: [8, 10, 8, 6, 4],
    margin: [40, 42, 43, 43, 42],
    tg: 3.0
  }
};

let activeScenario = 'Base';

function getVal(id) { return parseFloat(document.getElementById(id).value); }

function setScenario(name) {
  activeScenario = name;
  document.querySelectorAll('.scenario-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab' + name).classList.add('active');
  renderScenarioInputs();
  calc();
}

function renderScenarioInputs() {
  const s = presets[activeScenario];
  const div = document.getElementById('scenarioInputs');
  let h = '';
  h += '<div class="yr-header"><div class="label">Year</div><div>Growth %</div><div>EBIT Margin %</div></div>';
  for (let y = 0; y < 5; y++) {
    h += '<div class="yr-grid">';
    h += '<div class="label">Y' + (y+1) + '</div>';
    h += '<input type="number" id="g' + y + '" value="' + s.growth[y] + '" step="0.5" oninput="recalcScenario();calc()">';
    h += '<input type="number" id="m' + y + '" value="' + s.margin[y] + '" step="0.5" oninput="recalcScenario();calc()">';
    h += '</div>';
  }
  h += '<div class="param-row" style="margin-top:8px;"><label>Terminal Growth %</label><input type="number" id="tg" value="' + s.tg + '" step="0.1" oninput="recalcScenario();calc()"></div>';
  div.innerHTML = h;
}

function recalcScenario() {
  const s = presets[activeScenario];
  for (let y = 0; y < 5; y++) {
    s.growth[y] = parseFloat(document.getElementById('g' + y).value);
    s.margin[y] = parseFloat(document.getElementById('m' + y).value);
  }
  s.tg = parseFloat(document.getElementById('tg').value);
}

function calcWACC() {
  const rf = getVal('rf') / 100;
  const b = getVal('beta');
  const erp = getVal('erp') / 100;
  const price = getVal('price');
  const shares = getVal('shares');
  const netCash = getVal('netCash');
  const codPretax = getVal('cod') / 100;
  const tax = getVal('taxRate') / 100;

  const mcap = price * shares;
  const ev = mcap - netCash;
  // Total debt derived - for simplicity use netCash negative
  // We'll just use market-cap-based weights
  const totalDebt = Math.max(0, mcap * 0.01); // assume 1% debt-like if net cash positive
  const eqW = mcap / (mcap + totalDebt);
  const debtW = totalDebt / (mcap + totalDebt);

  const coe = rf + b * erp;
  const codAfter = codPretax * (1 - tax);
  const wacc = coe * eqW + codAfter * debtW;

  document.getElementById('waccDisplay').innerHTML =
    '<div class="row"><span class="lbl">Cost of Equity</span><span class="val">' + (coe*100).toFixed(2) + '%</span></div>' +
    '<div class="row"><span class="lbl">Cost of Debt (post-tax)</span><span class="val">' + (codAfter*100).toFixed(2) + '%</span></div>' +
    '<div class="row"><span class="lbl">Equity Weight</span><span class="val">' + (eqW*100).toFixed(1) + '%</span></div>' +
    '<div class="row"><span class="lbl">Debt Weight</span><span class="val">' + (debtW*100).toFixed(1) + '%</span></div>' +
    '<div class="row" style="border-top:1px solid var(--border);padding-top:4px;font-weight:700;"><span class="lbl">WACC</span><span class="val" style="color:var(--accent);">' + (wacc*100).toFixed(2) + '%</span></div>';

  return wacc;
}

function calc() {
  const price = getVal('price');
  const shares = getVal('shares');
  const netCash = getVal('netCash');
  const ttmRev = getVal('ttmRev');
  const ttmEbit = getVal('ttmEbit');
  const daPct = getVal('daRate') / 100;
  const capexPct = getVal('capexRate') / 100;
  const tax = getVal('taxRate') / 100;
  const nwcPct = getVal('nwcPct') / 100;

  const wacc = calcWACC();
  const mcap = price * shares;

  const results = {};
  let totalBaseEv = 0;

  for (const [sname, s] of Object.entries(presets)) {
    let rev = ttmRev;
    const proj = { revenue: [], ebit: [], nopat: [], ufcf: [], pv: [] };

    for (let y = 0; y < 5; y++) {
      rev *= (1 + s.growth[y] / 100);
      const ebit = rev * (s.margin[y] / 100);
      const nopat = ebit * (1 - tax);
      const da = rev * daPct;
      const capex = rev * capexPct;

      let prevRev = ttmRev;
      if (y > 0) {
        prevRev = ttmRev;
        for (let py = 0; py < y; py++) prevRev *= (1 + s.growth[py] / 100);
      }
      const dnwc = (rev - prevRev) * nwcPct;
      const ufcf = nopat + da - capex - dnwc;
      const pv = ufcf / Math.pow(1 + wacc, y + 0.5);

      proj.revenue.push(rev);
      proj.ebit.push(ebit);
      proj.nopat.push(nopat);
      proj.ufcf.push(ufcf);
      proj.pv.push(pv);
    }

    const pvSum = proj.pv.reduce((a, b) => a + b, 0);
    const lastUfcf = proj.ufcf[4];
    const tg = s.tg / 100;
    const tv = lastUfcf * (1 + tg) / (wacc - tg);
    const pvTv = tv / Math.pow(1 + wacc, 5);
    const ev = pvSum + pvTv;
    const eqVal = ev + netCash;
    const impPrice = eqVal / shares;
    const upside = (impPrice / price - 1) * 100;

    results[sname] = {
      proj, pvSum, tv, pvTv, ev, eqVal, impPrice, upside,
      tvPct: (pvTv / ev) * 100
    };

    if (sname === 'Base') totalBaseEv = ev;
  }

  renderValuation(results, price);
  renderFCF(results);
  renderBridge(results);
  renderSensitivity(wacc, shares, netCash, ttmRev, daPct, capexPct, tax, nwcPct);
  document.getElementById('activeScenario').textContent = activeScenario.toUpperCase();
}

function renderValuation(results, currentPrice) {
  const grid = document.getElementById('valGrid');
  const order = ['Bear', 'Base', 'Bull'];
  let h = '';
  for (const name of order) {
    const r = results[name];
    const cls = name.toLowerCase();
    const sign = r.upside >= 0 ? '+' : '';
    h += '<div class="val-card ' + cls + '">';
    h += '<div class="val">RM ' + r.impPrice.toFixed(3) + '</div>';
    h += '<div class="lbl">' + name + ' — ' + sign + r.upside.toFixed(1) + '% vs RM ' + currentPrice.toFixed(3) + '</div>';
    h += '</div>';
  }
  grid.innerHTML = h;
}

function renderFCF(results) {
  const r = results[activeScenario];
  if (!r) return;
  const table = document.getElementById('fcfTable');
  let h = '<tr><th>Year</th><th>Revenue</th><th>EBIT</th><th>NOPAT</th><th>+D&amp;A</th><th>-CapEx</th><th>-ΔNWC</th><th>UFCF</th><th>PV UFCF</th></tr>';
  for (let y = 0; y < 5; y++) {
    const p = r.proj;
    h += '<tr>';
    h += '<td>Y' + (y+1) + '</td>';
    h += '<td>' + fmt(p.revenue[y]) + '</td>';
    h += '<td>' + fmt(p.ebit[y]) + '</td>';
    h += '<td>' + fmt(p.nopat[y]) + '</td>';
    // D&A, CapEx, ΔNWC reconstructed
    const da = p.revenue[y] * (getVal('daRate') / 100);
    const capex = p.revenue[y] * (getVal('capexRate') / 100);
    let prevRev = getVal('ttmRev');
    if (y > 0) {
      const s = presets[activeScenario];
      prevRev = getVal('ttmRev');
      for (let py = 0; py < y; py++) prevRev *= (1 + s.growth[py] / 100);
    }
    const dnwc = (p.revenue[y] - prevRev) * (getVal('nwcPct') / 100);
    h += '<td>' + fmt(da) + '</td>';
    h += '<td>' + fmt(capex) + '</td>';
    h += '<td>' + fmt(dnwc) + '</td>';
    h += '<td style="font-weight:600;">' + fmt(p.ufcf[y]) + '</td>';
    h += '<td>' + fmt(p.pv[y]) + '</td>';
    h += '</tr>';
  }
  h += '<tr class="sum-row"><td>Sum PV(FCFs)</td><td colspan="7"></td><td>' + fmt(r.pvSum) + '</td></tr>';
  table.innerHTML = h;
}

function renderBridge(results) {
  const r = results[activeScenario];
  if (!r) return;
  const table = document.getElementById('bridgeTable');
  const data = [
    ['Sum of PV(FCFs)', r.pvSum],
    ['PV of Terminal Value', r.pvTv],
    ['Enterprise Value', r.ev],
    ['(+) Net Cash', getVal('netCash')],
    ['Equity Value', r.eqVal],
    ['Shares (M)', getVal('shares')],
    ['Implied Price/Share', r.impPrice],
  ];
  let h = '';
  for (const [label, val] of data) {
    const isBold = label === 'Enterprise Value' || label === 'Equity Value' || label === 'Implied Price/Share';
    const isHighlight = label === 'Implied Price/Share';
    h += '<tr' + (isBold ? ' style="font-weight:700;border-top:1px solid var(--border);"' : '') + '>';
    h += '<td>' + label + '</td>';
    h += '<td' + (isHighlight ? ' style="font-size:1.2rem;color:var(--accent);"' : '') + '>' +
         (label === 'Implied Price/Share' ? 'RM ' + val.toFixed(3) :
          label === 'Shares (M)' ? val.toFixed(0) + 'M' :
          'RM ' + fmt(val)) + '</td>';
    h += '</tr>';
  }
  table.innerHTML = h;
}

function renderSensitivity(baseWacc, shares, netCash, ttmRev, daPct, capexPct, tax, nwcPct) {
  const b = presets.Base;
  const waccs = [];
  for (let i = -2; i <= 2; i++) waccs.push(baseWacc + i * 0.01);
  const tgs = [1.5, 2.0, 2.5, 3.0, 3.5];

  function impliedPrice(w, tg) {
    let rev = ttmRev;
    let pvSum = 0;
    let lastUfcf = 0;
    for (let y = 0; y < 5; y++) {
      rev *= (1 + b.growth[y] / 100);
      const ebit = rev * (b.margin[y] / 100);
      const nopat = ebit * (1 - tax);
      const da = rev * daPct;
      const capex = rev * capexPct;
      let prevRev = ttmRev;
      if (y > 0) {
        prevRev = ttmRev;
        for (let py = 0; py < y; py++) prevRev *= (1 + b.growth[py] / 100);
      }
      const dnwc = (rev - prevRev) * nwcPct;
      const ufcf = nopat + da - capex - dnwc;
      lastUfcf = ufcf;
      pvSum += ufcf / Math.pow(1 + w, y + 0.5);
    }
    const tgDec = tg / 100;
    const tv = lastUfcf * (1 + tgDec) / (w - tgDec);
    const pvTv = tv / Math.pow(1 + w, 5);
    const ev = pvSum + pvTv;
    return (ev + netCash) / shares;
  }

  let h = '<div class="sensitivity-grid">';
  h += '<div class="cell header">WACC ↓ \\ TG →</div>';
  for (const tg of tgs) h += '<div class="cell header">' + tg.toFixed(1) + '%</div>';
  for (const w of waccs) {
    h += '<div class="cell row-label">' + (w * 100).toFixed(2) + '%</div>';
    for (const tg of tgs) {
      const ip = impliedPrice(w, tg);
      const basePrice = getVal('price');
      const cls = ip >= basePrice ? 'up' : 'down';
      h += '<div class="cell value ' + cls + '">' + ip.toFixed(3) + '</div>';
    }
  }
  h += '</div>';
  h += '<div style="margin-top:6px;font-size:0.7rem;color:var(--muted);">Green = above current price (' + getVal('price').toFixed(3) + '); Red = below</div>';
  document.getElementById('sensitivityTable').innerHTML = h;
}

function fmt(v) {
  if (Math.abs(v) >= 1) return v.toFixed(1);
  return v.toFixed(2);
}

renderScenarioInputs();
calc();
</script>
</body>
</html>
